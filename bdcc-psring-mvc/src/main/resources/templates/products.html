
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products List</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.5/css/bootstrap.min.css}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/user/index}">
            Gestion des produits
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/index}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/user/index}">
                        Products
                    </a>
                </li>

            </ul>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-light">
                    Logout
                </button>
            </form>

        </div>
    </div>
</nav>

<!-- Products -->
<div class="container p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Products List</h2>

        <!-- New Product : ADMIN uniquement -->
        <a class="btn btn-primary"
           sec:authorize="hasRole('ADMIN')"
           th:href="@{/admin/newProduct}">
            New Product
        </a>

    </div>

    <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>

            <!-- Action : ADMIN uniquement -->
            <th sec:authorize="hasRole('ADMIN')">Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="p : ${productList}">

            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.quantity}"></td>

            <!-- Un seul bouton Delete : ADMIN uniquement -->
            <td sec:authorize="hasRole('ADMIN')">
                <form method="post"
                      th:action="@{/admin/delete(id=${p.id})}"
                      onsubmit="return confirm('Are you sure?')">

                    <button type="submit" class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(productList)}">
            <td colspan="5" class="text-center text-muted">
                Aucun produit disponible.
            </td>
        </tr>

        </tbody>

    </table>

</div>

<script th:src="@{/webjars/bootstrap/5.3.5/js/bootstrap.bundle.min.js}">
</script>

</body>
</html>
