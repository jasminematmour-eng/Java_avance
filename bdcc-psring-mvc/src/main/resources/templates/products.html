
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products List</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.5/css/bootstrap.min.css}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">Navbar</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/index}">Products</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       data-bs-toggle="dropdown">
                        Dropdown
                    </a>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link disabled" href="#">Disabled</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- Products -->
<div class="container p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Products List</h2>

        <a class="btn btn-primary" th:href="@{/admin/newProduct}">
            new product
        </a>

    </div>

    <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="p : ${productList}">

            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.quantity}"></td>

            <td>
                <a class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')"
                   th:href="@{/admin/delete(id=${p.id})}">
                    Delete
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script th:src="@{/webjars/bootstrap/5.3.5/js/bootstrap.bundle.min.js}">
</script>

</body>
</html>
