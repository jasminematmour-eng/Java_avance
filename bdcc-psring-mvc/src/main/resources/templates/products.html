<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<div>
    <table>
        <thead>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Quantity</th>
        </thead>
        <tbody>
        <tr th:each="p:${productList}">
            <td th:test="${p.id}"></td>
            <td th:test="${p.name}"></td>
            <td th:test="${p.price}"></td>
            <td th:test="${p.quantity}"></td>
        </tr>
        </tbody>
    </table>
</div>
<h2>Test</h2>
</body>
</html>
