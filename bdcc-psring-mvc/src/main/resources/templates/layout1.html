
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout1}">

<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>

<body>
<div class="p-3 layout:fragment="content1>
    <form method="post" th:action="@{/saveProduct}">
        <div class="mb-3">
            <label class="form-label">name</label>
            <input class="form-control" type="text" name="name" th:value="${product.name}" >
            <spam class="text-danger" th:errors="${product.name}"></spam>
        </div>
        <div class="mb-3">
            <label class="form-label">price</label>
            <input class="form-control" type="text" name="price" th:value="${product.price}" >
            <spam class="text-danger" th:errors="${product.price}"></spam>
        </div>
        <div class="mb-3">
            <label class="form-label">quantity</label>
            <input class="form-control" type="text" name="quantity" th:value="${product.quantity}" >
            <spam class="text-danger" th:errors="${product.quantity}"></spam>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>

</div>

</body>
</html>
